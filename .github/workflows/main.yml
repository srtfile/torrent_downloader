name: Torrent Downloader

# ──────────────────────────────────────────────────────────────────────────────
# ABI FIX NOTES (do not remove — explains every non-obvious decision):
#
#   1. NO actions/setup-python  → apt's python3-libtorrent.so is linked against
#      the SYSTEM /usr/bin/python3. setup-python swaps in a different binary
#      (pyenv / deadsnakes) causing "unreported exception" on import.
#
#   2. Always call `python3` / `pip3`, never `python` / `pip`.
#
#   3. runs-on: ubuntu-22.04  → pinned; ubuntu-latest (24.04) ships
#      python3-libtorrent 2.x with a different ABI again.
#
#   4. NO --break-system-packages  → that flag was added in pip 23.x.
#      ubuntu-22.04's bundled pip is 22.x and rejects it with "no such option".
#      On 22.04 the "externally managed" PEP 668 restriction doesn't exist,
#      so the flag is unnecessary anyway.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Magnet links or .torrent URLs, one per line"
        required: true
        type: string
      timeout:
        description: "Hard timeout per download (seconds)"
        default: "3600"
        required: false
      stall_timeout:
        description: "Abort if no progress for this many seconds"
        default: "300"
        required: false
      retries:
        description: "Max retry attempts per source"
        default: "3"
        required: false
      max_download_kbps:
        description: "Download speed cap KB/s  (0 = unlimited)"
        default: "0"
        required: false
      upload_to_release:
        description: "Publish files as a GitHub Release?"
        default: "false"
        type: boolean
      verbose:
        description: "Enable verbose / debug logging"
        default: "false"
        type: boolean

  repository_dispatch:
    types: [torrent]

  # schedule:
  #   - cron: "0 2 * * *"

env:
  OUTPUT_DIR: downloads

jobs:
  download:
    name: Download Torrents
    # ─── PINNED: 22.04 ships python3-libtorrent 1.2.x / Python 3.10 (stable ABI)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. System deps — NO setup-python (see ABI notes at top) ───────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-pip \
            python3-libtorrent \
            libboost-python1.74.0 \
            libssl3 \
            curl

      # ── 3. Upgrade pip safely (no --break-system-packages on 22.04 pip) ───
      - name: Upgrade pip
        run: |
          # Upgrade pip via the get-pip bootstrapper so we control the version,
          # then verify the import works with the SYSTEM interpreter.
          curl -fsSL https://bootstrap.pypa.io/get-pip.py | python3 - --quiet
          python3 -c "import libtorrent as lt; print('libtorrent OK --', lt.version)"

      # ── 4. Syntax check ────────────────────────────────────────────────────
      - name: Syntax check
        run: python3 -m py_compile torrent_downloader.py && echo "Syntax OK"

      # ── 5. Resolve sources ─────────────────────────────────────────────────
      - name: Resolve torrent sources
        env:
          WD_SOURCES: ${{ github.event.inputs.sources }}
          RD_SOURCES: ${{ github.event.client_payload.sources }}
        run: |
          SOURCES="${WD_SOURCES:-$RD_SOURCES}"
          if [ -z "$SOURCES" ]; then
            echo "::error::No torrent sources provided."
            exit 1
          fi
          printf '%s' "$SOURCES" > /tmp/torrent_sources.txt
          echo "Queued $(wc -l < /tmp/torrent_sources.txt) source(s):"
          cat /tmp/torrent_sources.txt

      # ── 6. Fetch remote .torrent files ─────────────────────────────────────
      - name: Fetch remote .torrent files
        run: |
          mkdir -p torrent_files
          while IFS= read -r line; do
            if [[ "$line" =~ ^https?://.*\.torrent$ ]]; then
              fname="torrent_files/$(basename "$line")"
              echo "Fetching: $line"
              curl -fsSL "$line" -o "$fname"
              sed -i "s|$line|$fname|g" /tmp/torrent_sources.txt
            fi
          done < /tmp/torrent_sources.txt

      # ── 7. Run downloader ──────────────────────────────────────────────────
      - name: Run torrent downloader
        env:
          TORRENT_OUTPUT:  ${{ env.OUTPUT_DIR }}
          TORRENT_TIMEOUT: ${{ github.event.inputs.timeout        || '3600' }}
          TORRENT_STALL:   ${{ github.event.inputs.stall_timeout  || '300'  }}
          TORRENT_RETRIES: ${{ github.event.inputs.retries        || '3'    }}
          TORRENT_MAX_DL:  ${{ github.event.inputs.max_download_kbps || '0' }}
          TORRENT_MAX_UL:  "50"
          CI:              "true"
        run: |
          VERBOSE_FLAG=""
          [ "${{ github.event.inputs.verbose }}" = "true" ] && VERBOSE_FLAG="--verbose"

          export TORRENT_SOURCES="$(cat /tmp/torrent_sources.txt)"

          python3 torrent_downloader.py \
            --output-dir        "$TORRENT_OUTPUT"  \
            --timeout           "$TORRENT_TIMEOUT" \
            --stall-timeout     "$TORRENT_STALL"   \
            --retries           "$TORRENT_RETRIES" \
            --max-download-kbps "$TORRENT_MAX_DL"  \
            --max-upload-kbps   "$TORRENT_MAX_UL"  \
            $VERBOSE_FLAG

      # ── 8. Print summary ───────────────────────────────────────────────────
      - name: Print download summary
        if: always()
        run: |
          SUMMARY="${{ env.OUTPUT_DIR }}/torrent_summary.json"
          [ -f "$SUMMARY" ] && python3 -m json.tool "$SUMMARY" \
                            || echo "No summary file found."

      # ── 9. Upload artifact ─────────────────────────────────────────────────
      - name: Upload downloaded files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torrent-downloads-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 7
          if-no-files-found: warn

      # ── 10. Optional GitHub Release ────────────────────────────────────────
      - name: Create GitHub Release
        if: success() && github.event.inputs.upload_to_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="torrent-run-${{ github.run_id }}"
          gh release create "$TAG" \
            --title "Torrent Download -- Run #${{ github.run_number }}" \
            --notes "Automated download. See torrent_summary.json for details." \
            --prerelease \
            ${{ env.OUTPUT_DIR }}/**

  # ── Notify on failure ───────────────────────────────────────────────────────
  notify:
    name: Notify on failure
    needs: download
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Emit failure annotation
        run: |
          echo "::error title=Torrent Download Failed::Check the 'download' job logs and torrent_summary.json artifact."
